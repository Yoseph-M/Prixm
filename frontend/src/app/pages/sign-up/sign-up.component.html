<div class="auth-split-layout">
  <!-- Left Side: Image & Branding -->
  <div class="auth-split-left">
    <div class="auth-left-content">
      <a routerLink="/" class="auth-brand-logo">
        <img src="/logo.png" alt="Prixm" style="height: 32px; width: auto;">
      </a>

      <div class="auth-left-text">
        <h1 class="auth-left-heading">Everything you need,<br/>to track every subscription.</h1>
        <p class="auth-left-subtext">Manage your spending, get renewal alerts, and cancel unwanted services effortlessly.</p>
      </div>
    </div>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-split-right">
    <div class="auth-form-container">
      <h2 class="auth-right-heading">Create your account</h2>
      <p class="auth-right-subtext">
        Already have an account? <a routerLink="/signin" class="auth-link">Log in</a>
      </p>

      @if (validationError || authService.error()) {
        <div class="auth-error-banner">
          {{ validationError || authService.error() }}
        </div>
      }

      <form (submit)="handleSignUp(); $event.preventDefault()" class="auth-form">
        
        <div class="input-group">
          <input id="name" name="name" [(ngModel)]="name" type="text" class="input" placeholder="Full Name" autocomplete="name" />
        </div>

        <div class="input-group">
          <input id="email" name="email" [(ngModel)]="email" type="email" class="input" placeholder="Email address" autocomplete="email" />
        </div>

        <div class="input-group">
          <div class="password-input-wrap">
            <input id="password" name="password" [(ngModel)]="password" type="password" class="input" placeholder="Password" autocomplete="new-password" />
          </div>
        </div>

        <div class="input-group">
          <div class="password-input-wrap">
            <input id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" type="password" class="input" placeholder="Confirm Password" autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full signin-btn" [disabled]="loading">
          @if (loading) { <span class="btn-spinner"></span> }
          {{ loading ? 'Creating account…' : 'Sign up for free' }}
        </button>
      </form>

      <div class="divider">OR</div>

      <div class="auth-social-buttons">
        <button (click)="handleGoogleSignUp()" type="button" class="btn btn-outline w-full google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign up with Google
        </button>
      </div>

    </div>
  </div>
</div>
