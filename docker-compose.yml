services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: submgr-frontend
    ports:
      - "5173:5000"
    env_file: ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/.env:/app/.env:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - submgr-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: submgr-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-submgr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-service-account.json}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/service-account.json:/app/service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - submgr-net

  mongo:
    image: mongo:7
    container_name: submgr-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DB: submgr
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - submgr-net

  redis:
    image: redis:7-alpine
    container_name: submgr-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - submgr-net

volumes:
  mongo_data:
  redis_data:

networks:
  submgr-net:
    driver: bridge
